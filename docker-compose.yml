version: '3.8'

services:
  # Next.jsアプリケーション
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: kintime-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://kintime:kintime_password@db:3306/kintime
      - JWT_SECRET_STRING=your_very_strong_jwt_secret_key_minimum_32_characters
      - UPLOAD_DIR=./public/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kintime-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL データベース
  db:
    image: mysql:8.0
    container_name: kintime-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_this
      MYSQL_DATABASE: kintime
      MYSQL_USER: kintime
      MYSQL_PASSWORD: kintime_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - kintime-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kintime", "-pkintime_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Nginx リバースプロキシ
  nginx:
    image: nginx:alpine
    container_name: kintime-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/uploads:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - kintime-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis（セッション管理・キャッシュ用）
  redis:
    image: redis:7-alpine
    container_name: kintime-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - kintime-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  db_data:
    name: kintime_db_data
  uploads:
    name: kintime_uploads
  redis_data:
    name: kintime_redis_data

networks:
  kintime-network:
    name: kintime-network
    driver: bridge